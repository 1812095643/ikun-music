[package]
name = "alger-music-player-tauri"
version = "5.1.0"
description = "Alger Music Player Tauri"
authors = ["Alger <algerkc@qq.com>"]
edition = "2021"

[lib]
name = "alger_music_player_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
tauri = { version = "2.9.3", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-opener = "2.5.0"
tauri-plugin-dialog = "2.4.0"
tauri-plugin-fs = "2.4.2"
tauri-plugin-http = "2.5.2"
tauri-plugin-shell = "2.3.1"
tauri-plugin-store = "2.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
