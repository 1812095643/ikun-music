name: 构建安卓手机平板车机预览版

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 发布到 GitHub 预览发行版
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-android
  cancel-in-progress: false

jobs:
  android:
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '25.8.1'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: 准备 Android 编译工具
        run: |
          sdkmanager 'platforms;android-36.1' 'build-tools;36.1.0'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: 获取并校验官方离线 SDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'dcloud-android'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          gh release download build-tools-android-5.26 --repo $env:GITHUB_REPOSITORY --pattern 'Android-SDK@5.26.82680_20260914.zip' --dir $directory
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $archive = Join-Path $directory 'Android-SDK@5.26.82680_20260914.zip'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne '09E6FE341373AA780FE9A1D4F5B093B8FB7B1B039C4837A176F447FF38F3650A') { throw 'DCloud SDK checksum mismatch.' }
          tar.exe -xf $archive -C $directory 'Android-SDK@5.26.82680_20260914'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "DCLOUD_ANDROID_SDK=$(Join-Path $directory 'Android-SDK@5.26.82680_20260914')" >> $env:GITHUB_ENV
      - run: npm ci --prefix mobile
      - name: 编译并验证车机扩展与 App 资源
        run: |
          npm --prefix mobile run test:device-kit
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix mobile run typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix mobile run test:update
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix mobile run build:app
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: 使用本应用签名离线生成 APK
        env:
          DCLOUD_APPKEY: ${{ secrets.DCLOUD_APPKEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if (!$env:DCLOUD_APPKEY -or !$env:ANDROID_KEYSTORE_BASE64 -or !$env:ANDROID_KEYSTORE_PASSWORD -or !$env:ANDROID_KEY_ALIAS) { throw 'Offline AppKey and Android signing secrets must be configured.' }
          $env:ANDROID_KEYSTORE_FILE = Join-Path $env:RUNNER_TEMP 'ikun-release.keystore'
          try {
            [System.IO.File]::WriteAllBytes($env:ANDROID_KEYSTORE_FILE, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64.Trim()))
            npm --prefix mobile run build:apk
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally {
            Remove-Item -LiteralPath $env:ANDROID_KEYSTORE_FILE -Force -ErrorAction SilentlyContinue
          }
      - name: 核对应用资源与原生播放器
        shell: bash
        run: |
          python - <<'PY'
          import glob, zipfile, json
          apk = glob.glob('release-stage/android/*.apk')[0]
          with open('mobile/src/manifest.json', encoding='utf-8') as source:
              appid = json.load(source)['appid']
          with zipfile.ZipFile(apk) as archive:
              names = archive.namelist()
              assert f'assets/apps/{appid}/www/manifest.json' in names, 'Missing application resources'
              registration = json.loads(archive.read('assets/dcloud_uniplugins.json'))
              assert any(item['name'] == 'Ikun-DeviceKit' for entry in registration['nativePlugins'] for item in entry['plugins']), 'Missing native module registration'
              dex = b''.join(archive.read(name) for name in names if name.startswith('classes') and name.endswith('.dex'))
              for symbol in [b'Lcn/ikun/music/device/DeviceKit;', b'Lcn/ikun/music/device/DeviceKitModule;', b'Landroidx/media3/exoplayer/ExoPlayer;']:
                  assert symbol in dex, 'Missing native playback classes'
              architectures = {name.split('/')[1] for name in names if name.startswith('lib/') and name.endswith('.so')}
              assert architectures == {'arm64-v8a', 'armeabi-v7a'}, 'Unexpected APK architectures'
          print('Application identity, native module, Media3 and ARM architectures verified.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-stage/android/
          if-no-files-found: error
          retention-days: 14
  publish:
    if: ${{ inputs.publish }}
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-stage/android
      - name: 发布独立移动预览版
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./mobile/package.json").version')"
          tag="mobile-v$version"
          gh release create "$tag" release-stage/android/* --target "$GITHUB_SHA" --draft --prerelease --latest=false --title "ikun音乐 Android $version" --notes-file mobile/release-notes.md
          gh release edit "$tag" --draft=false --prerelease --latest=false
